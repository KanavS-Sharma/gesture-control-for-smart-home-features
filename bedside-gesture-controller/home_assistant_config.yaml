# ============================================================
#  Home Assistant — Bedside Gesture Controller Automations
#  Add these to your configuration.yaml or automations.yaml
# ============================================================

# ── MQTT Sensor entities ─────────────────────────────────────
mqtt:
  sensor:
    - name: "Bedside Presence"
      unique_id: bedside_presence
      state_topic: "bedside/presence"
      icon: mdi:motion-sensor

    - name: "Bedside Lux"
      unique_id: bedside_lux
      state_topic: "bedside/lux"
      unit_of_measurement: "lx"
      device_class: illuminance
      icon: mdi:brightness-6

    - name: "Bedside Mode"
      unique_id: bedside_mode
      state_topic: "bedside/mode"
      icon: mdi:gesture-tap

    - name: "Bedside Last Gesture"
      unique_id: bedside_gesture
      state_topic: "bedside/gesture"
      icon: mdi:hand-wave

# ── Automations ───────────────────────────────────────────────
automation:

  # ── Spotify: Next Track ─────────────────────────────────────
  - id: bedside_gesture_next
    alias: "Bedside → Next Track"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "next"
    condition:
      - condition: state
        entity_id: sensor.bedside_mode
        state: "spotify"
    action:
      - service: media_player.media_next_track
        target:
          entity_id: media_player.your_spotify_speaker  # ← Change this

  # ── Spotify: Previous Track ─────────────────────────────────
  - id: bedside_gesture_prev
    alias: "Bedside → Previous Track"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "prev"
    action:
      - service: media_player.media_previous_track
        target:
          entity_id: media_player.your_spotify_speaker

  # ── Smart Home: Curtain Open ─────────────────────────────────
  - id: bedside_curtain_open
    alias: "Bedside → Open Curtains"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "curtain_open"
    action:
      - service: cover.open_cover
        target:
          entity_id: cover.bedroom_curtain  # ← Change this

  # ── Smart Home: Curtain Close ────────────────────────────────
  - id: bedside_curtain_close
    alias: "Bedside → Close Curtains"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "curtain_close"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.bedroom_curtain

  # ── Smart Home: Light Toggle ─────────────────────────────────
  - id: bedside_light_toggle
    alias: "Bedside → Light Toggle"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "light_toggle"
    action:
      - service: light.toggle
        target:
          entity_id: light.bedroom_main  # ← Change this

  # ── Smart Home: Light Brighter ───────────────────────────────
  - id: bedside_light_brighter
    alias: "Bedside → Light Brighter"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "light_brighter"
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_main
        data:
          brightness_step_pct: 20

  # ── Smart Home: Light Dimmer ─────────────────────────────────
  - id: bedside_light_dimmer
    alias: "Bedside → Light Dimmer"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "light_dimmer"
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_main
        data:
          brightness_step_pct: -20

  # ── Smart Home: Light Color Next ─────────────────────────────
  - id: bedside_light_color_next
    alias: "Bedside → Light Color Cycle"
    trigger:
      - platform: mqtt
        topic: bedside/gesture
        payload: "light_color_next"
    variables:
      color_list:
        - [255, 147, 41]   # Warm white
        - [255, 200, 100]  # Soft yellow
        - [100, 180, 255]  # Cool blue
        - [200, 100, 255]  # Purple
        - [100, 255, 150]  # Green
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_main
        data:
          rgb_color: >
            {% set colors = [[255,147,41],[255,200,100],[100,180,255],[200,100,255],[100,255,150]] %}
            {% set idx = (now().timestamp() | int) % colors | length %}
            {{ colors[idx] }}

  # ── Auto: Turn off lights when no presence detected ──────────
  - id: bedside_auto_sleep_lights
    alias: "Bedside → Auto Dim on Sleep"
    trigger:
      - platform: state
        entity_id: sensor.bedside_presence
        to: "absent"
        for:
          minutes: 10
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_main
        data:
          brightness_pct: 10
          transition: 30

  # ── Auto: Adaptive light when presence detected at night ─────
  - id: bedside_presence_night_light
    alias: "Bedside → Night Light on Presence"
    trigger:
      - platform: state
        entity_id: sensor.bedside_presence
        to: "present"
    condition:
      - condition: numeric_state
        entity_id: sensor.bedside_lux
        below: 5      # Very dark room
      - condition: time
        after: "22:00:00"
        before: "07:00:00"
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_main
        data:
          brightness_pct: 5
          rgb_color: [255, 100, 50]   # Warm dim red (night-friendly)
          transition: 3
